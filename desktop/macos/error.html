<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>琪舟阁</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    background:#FDF8F3;
    font-family:"PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; position:relative; padding:20px;
  }
  body::before, body::after {
    content:""; position:absolute; border-radius:50%;
    filter:blur(70px); opacity:.62; pointer-events:none;
  }
  body::before { width:420px; height:420px; background:#EAD6BA; top:-160px; left:-130px; }
  body::after  { width:380px; height:380px; background:#C3D0E3; bottom:-170px; right:-140px; }

  .card {
    position:relative; width:100%; max-width:340px; padding:32px 28px 26px;
    background:rgba(255,255,255,.74);
    border:1px solid rgba(255,255,255,.92);
    border-radius:24px;
    box-shadow:0 20px 52px rgba(48,85,128,.14), 0 2px 10px rgba(48,85,128,.05);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    text-align:center;
    animation:rise .4s cubic-bezier(.22,.9,.3,1) both;
  }
  @keyframes rise { from { opacity:0; transform:translateY(14px) scale(.98); } to { opacity:1; transform:none; } }

  h1 { font-size:18px; font-weight:600; color:#1F2937; }
  .sub { margin-top:9px; font-size:13px; color:#6B7280; line-height:1.7; }

  button {
    width:100%; height:46px; margin-top:12px; border:none; border-radius:16px;
    font-size:15px; font-family:inherit; letter-spacing:3px; cursor:pointer;
    transition:background .18s, border-color .18s, transform .1s;
  }
  .primary { margin-top:26px; background:#305580; color:#fff; box-shadow:0 10px 24px rgba(48,85,128,.24); }
  .primary:hover { background:#3B6391; }
  .ghost { background:#fff; color:#1F2937; border:1px solid #EAD6BA; }
  .ghost:hover { background:#FBF6EF; }
  button:active { transform:translateY(1px) scale(.996); }
</style>
</head>
<body>
  <div class="card">
    <h1>打不开这个网址</h1>
    <div class="sub">检查域名拼写和网络后重试</div>
    <button class="primary" id="retry">重 试</button>
    <button class="ghost" id="change">更换域名</button>
  </div>
<script>
  function send(action) {
    if (window.chrome && window.chrome.webview) { window.chrome.webview.postMessage(action); return; }
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.app) {
      window.webkit.messageHandlers.app.postMessage(action); return;
    }
    location.href = 'zqnavgo:' + encodeURIComponent(action);
  }
  document.getElementById('retry').addEventListener('click', function () { send('retry'); });
  document.getElementById('change').addEventListener('click', function () { send('change'); });
</script>
</body>
</html>
